# Set prefix to Ctrl-a (default is Ctrl-b)
unbind C-b
set -g prefix C-a

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable mouse support
set -g mouse on

# Start window/pane numbers at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Aggressive resize
setw -g aggressive-resize on

# Don't rename windows automatically
set -g allow-rename off

# Longer history
set -g history-limit 50000

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style bg=colour237,fg=colour255
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour235,bg=colour240] #S #[fg=colour240,bg=colour237] "
set -g status-right "#[fg=colour240,bg=colour237] %Y-%m-%d  %H:%M #[fg=colour250,bg=colour240] #[fg=colour235,bg=colour250] #h "

# Window status
setw -g window-status-style fg=colour244,bg=colour237
setw -g window-status-current-style fg=colour250,bg=colour235,bold
setw -g window-status-activity-style fg=yellow,bg=colour237
setw -g window-status-bell-style fg=red,bg=colour237

# Active pane border
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240

# Message text
set -g message-style fg=colour232,bg=colour250
set -g message-command-style fg=colour232,bg=colour250

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X begin-selection \; send -X rectangle-toggle

# Paste
unbind p
bind p paste-buffer

# Sync panes (send input to all panes)
bind C-s setw synchronize-panes

# Rotate window
bind O rotate-window -D
bind ^O rotate-window -U

# Zoom pane
bind -n M-z resize-pane -Z

# Swap pane with another
bind ^u swap-pane -D
bind ^d swap-pane -U

# Smart pane switching (when using vim-tmux-navigator or similar)
# Requires terminal-overrides for xterm keys
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:XT"

# Don't reset terminal colors
set -g default-shell /bin/bash

# More colors!
set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Better escape key timing
set -sg escape-time 0

# Faster response
set -sg repeat-time 300

# Focus events
set -g focus-events on

# Extended colors
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",screen*:Tc"

# Open new windows in current directory
bind c new-window -c "#{pane_current_path}"
